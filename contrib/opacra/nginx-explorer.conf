# nginx site for the Opacra block explorer. certbot adds the HTTPS server block.
limit_req_zone $binary_remote_addr zone=explorer:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name explorer.opacra.org;

    # No access log: the output decoder puts addresses and view keys in URLs,
    # and the explorer promises no tracking.
    access_log off;
    error_log /var/log/nginx/explorer.error.log warn;

    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        limit_req zone=explorer burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }
}
